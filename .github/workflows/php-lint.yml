name: PHP lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint PHP files
        run: find files/zc_plugins/PluginHealthGuard/v1.0.5 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test scanner
        run: php -d zend.assertions=1 -d assert.exception=1 tests/scanner-test.php
      - name: Check package versions
        run: bash tests/check-package.sh

      - name: Build single-version release archive
        run: python3 tests/build-release.py
